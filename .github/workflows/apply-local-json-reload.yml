name: Apply Monex local JSON reload fix

on:
  push:
    branches:
      - agent/add-monex-history-capture
    paths:
      - .github/workflows/apply-local-json-reload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-monex-history-capture
          fetch-depth: 0

      - name: Patch Streamlit behavior
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("metals_spot_w_corr_app.py")
          text = app_path.read_text(encoding="utf-8")

          old_button = '    run_curl = st.button("Refresh Monex JSON files", use_container_width=True)'
          new_button = '    reload_monex_json = st.button("Reload Monex JSON files from disk", use_container_width=True)'
          if old_button not in text:
              raise SystemExit("Could not find the old main-page Monex refresh button.")
          text = text.replace(old_button, new_button, 1)

          old_block = '''if run_curl:
              refresh_messages = []

              for key, meta in MONEX_PRODUCTS.items():
                  ok, msg = refresh_monex_json_to_file(
                      output_path=Path(meta["json_file"]),
                      symbol=meta["symbol"],
                      referer_symbol=meta["referer_symbol"],
                      bearer_token=meta["bearer_token"],
                  )
                  refresh_messages.append(msg)

              st.cache_data.clear()
              status_placeholder.info("\\n".join(refresh_messages))

          '''
          new_block = '''if reload_monex_json:
              available_files = []
              missing_files = []

              for meta in MONEX_PRODUCTS.values():
                  path = Path(meta["json_file"])
                  if path.exists():
                      available_files.append(path.name)
                  else:
                      missing_files.append(path.name)

              # Clear only caches that parse and concatenate the local Monex files.
              # Yahoo/FRED caches remain warm, and no Monex network request is made.
              load_monex_json_cached.clear()
              build_monex_all_df.clear()

              if available_files:
                  status_placeholder.success(
                      "Reloaded local Monex JSON data from: "
                      + ", ".join(available_files)
                  )
              if missing_files:
                  status_placeholder.warning(
                      "Missing local Monex JSON files: " + ", ".join(missing_files)
                  )

          '''
          if old_block not in text:
              raise SystemExit("Could not find the old run_curl request block.")
          text = text.replace(old_block, new_block, 1)

          old_manual = '    run_refresh = st.button("Refresh Monex JSON files using manual token input")'
          new_manual = '    run_refresh = st.button("Query Monex using manual token input")'
          if old_manual in text:
              text = text.replace(old_manual, new_manual, 1)

          app_path.write_text(text, encoding="utf-8")

          page_path = Path("pages/1_Automated_Monex_Refresh.py")
          page_text = page_path.read_text(encoding="utf-8")
          old_clear = '''            if result.returncode == 0:
                          st.cache_data.clear()
                          capture_status.update(
          '''
          new_clear = '''            if result.returncode == 0:
                          capture_status.update(
          '''
          if old_clear not in page_text:
              raise SystemExit("Could not find the global cache clear in the automated page.")
          page_text = page_text.replace(old_clear, new_clear, 1)
          page_path.write_text(page_text, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "## Manual Monex refresh\n"
          replacement = '''## Reloading local Monex JSON files

          The main dashboard button **Reload Monex JSON files from disk** does not contact Monex. It clears only the local Monex parsing caches and immediately rereads the existing `history_*.json` files in the application directory. Use it after the Playwright helper or another process has written updated JSON files.

          ## Manual Monex refresh
          '''
          if marker in readme and "## Reloading local Monex JSON files" not in readme:
              readme = readme.replace(marker, replacement, 1)
          readme = readme.replace(
              "10. Select **Refresh Monex JSON files using manual token input**.",
              "10. Select **Query Monex using manual token input**.",
          )
          readme_path.write_text(readme, encoding="utf-8")

      - name: Validate syntax
        run: |
          python -m py_compile metals_spot_w_corr_app.py pages/1_Automated_Monex_Refresh.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metals_spot_w_corr_app.py pages/1_Automated_Monex_Refresh.py README.md
          git commit -m "Reload Monex JSON files locally from main dashboard"
          git push origin HEAD:agent/add-monex-history-capture
